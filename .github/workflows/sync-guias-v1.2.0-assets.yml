name: Sync Guias v1.2.0 validated assets

on:
  push:
    paths:
      - '.github/workflows/sync-guias-v1.2.0-assets.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download exact validated v1.2.0 static assets
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN="plugins/forja-mineira-guias"
          BASE="https://forjamineirad20.com.br/wp-content/plugins/forja-mineira-guias"
          mkdir -p "$PLUGIN/assets/images" "$PLUGIN/assets/css" "$PLUGIN/assets/js"

          UA="Mozilla/5.0 (compatible; ForjaMineiraSync/1.0)"
          REF="https://forjamineirad20.com.br/"

          curl --retry 5 --retry-delay 3 -A "$UA" -H "Referer: $REF" -fsSL             "$BASE/assets/css/guide-warlock-items.css" -o "$PLUGIN/assets/css/guide-warlock-items.css"
          curl --retry 5 --retry-delay 3 -A "$UA" -H "Referer: $REF" -fsSL             "$BASE/assets/css/guides-hub.css" -o "$PLUGIN/assets/css/guides-hub.css"
          curl --retry 5 --retry-delay 3 -A "$UA" -H "Referer: $REF" -fsSL             "$BASE/assets/js/guides-hub.js" -o "$PLUGIN/assets/js/guides-hub.js"

          cat > /tmp/fmg-static.sha256 <<'EOF'
          c97d886e4620f97a593c8db2ef558e630d9a45925fb83ece5ccdccda8d5e49be  plugins/forja-mineira-guias/assets/css/guide-warlock-items.css
          1f1b1fe33d2839d2f91b4cfea21317adc2836430e32a4c1204fe10da801f5ae5  plugins/forja-mineira-guias/assets/css/guides-hub.css
          9b8c007786c57b439d2fd1ab6b5d5ca8abc0546d7d2f9b051b6dbc91f7815d25  plugins/forja-mineira-guias/assets/js/guides-hub.js
          EOF
          sha256sum --check /tmp/fmg-static.sha256

          cat > /tmp/fmg-images.sha256 <<'EOF'
          2435fbddda0fbd9ec276330b24f81ce8b9f573f3734dbb8dbd26f3cf3cf4e717  backgrounds.webp
          253ffd220b1a1991d7743c6621173c1594d4392b4e6146838ff994c5fd6eda77  bruxo-warlock.webp
          5906f5599f4209c98736fa8b0b2ba51a79cd8fe5e5eb6061de17d84cc58259db  builds.webp
          f17bf5fcc6aa870cf2b19159cea9e4abf22234bb5f23c425663490db11b81152  classes.webp
          395eb71cfb67d34d435e8283e66e71a963fb69acd9c66aa72ec3ef3dbf681ff6  dnd-5e-2024.webp
          fc29a90dc88bc24fbb9f33049bee2638644c0f13f7219d6c8c459f05e331c627  elyra-guia-itens-card-aprovada.webp
          51ae8f79e151a26695de73d345182788625ddd162ae3496ebcdab22d31c87062  feats.webp
          3af848425c6de9185945d6304b7b8f6eed31881059cb63160031a6d8a6755cbb  forja-bussola-institucional.webp
          a20a5d15d58bdeecc067cd71196cd8218343aaf0b01c0ed7ffc2c1d33a3f51b7  guia-itens-bruxo-1-5.webp
          afe812f9cad3f3a8160715ce3d070f40ddbc7084896c6d03265e483eb5ce0b36  home-featured-guide-invocacoes.webp
          147755ef5d35904f77272633d0042cd0b6ff47a1b67f72b344517d2ddbd0fe00  hub-guias-hero-aprovado.webp
          e59aa8d6ff8c078cb31a210c83e5080ee4bb21800f213537624f14c2bc88618a  itens.webp
          ec6839ec277553cfb46ac4f8aea6dfc6dd0ff2406dd1dfb55d8d802050dada32  maera-banner-referencia-aprovada.webp
          68df97664064926d6c0e140ad4de526149835ba4f3560022a795f27e20880bf8  spells.webp
          EOF

          while read -r hash file; do
            curl --retry 5 --retry-delay 3 -A "$UA" -H "Referer: $REF" -fsSL               "$BASE/assets/images/$file" -o "$PLUGIN/assets/images/$file"
          done < /tmp/fmg-images.sha256

          (
            cd "$PLUGIN/assets/images"
            sha256sum --check /tmp/fmg-images.sha256
          )

      - name: Commit exact static assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Forja Mineira Automation"
          git config user.email "96450995+Peruzini@users.noreply.github.com"
          git add plugins/forja-mineira-guias/assets
          if git diff --cached --quiet; then
            echo "Static assets already match v1.2.0."
            exit 0
          fi
          git commit -m "release: sync validated Guias v1.2.0 static assets"
          git push origin HEAD:main
