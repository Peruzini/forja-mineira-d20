name: SPELL-06B exportador (preview-only)
on:
  pull_request:
    paths:
      - 'qa/spell-06b/**'
      - '.github/workflows/spell-06b-exporter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar testes do exportador
        run: node --test qa/spell-06b/exporter.test.cjs
