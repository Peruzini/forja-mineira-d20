name: Package Forja Mineira Guia de Magias Plugin

on:
  push:
    paths:
      - 'plugins/forja-mineira-guia-magias/**'
      - '.github/workflows/package-guia-magias-plugin.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package plugin
        run: |
          mkdir -p dist
          cp -R plugins/forja-mineira-guia-magias dist/forja-mineira-guia-magias
          cd dist
          zip -r forja-mineira-guia-magias-v1.2.1.zip forja-mineira-guia-magias

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: forja-mineira-guia-magias-v1.2.1
          path: dist/forja-mineira-guia-magias-v1.2.1.zip
          if-no-files-found: error
