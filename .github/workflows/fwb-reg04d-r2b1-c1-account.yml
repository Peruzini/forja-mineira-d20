name: FWB-REG-04D-R2B1-C1 — Real Keycloak Account REST self-edit

on:
  pull_request:
    paths:
      - 'tests/fwb-reg04d-r2b1/**'
      - 'mcp/fwb05-poc/reg04d-r2b1/**'
      - '.github/workflows/fwb-reg04d-r2b1-c1-account.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-unit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit security regressions
        working-directory: mcp/fwb05-poc
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build

  keycloak-native-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install HTTP client and dependencies
        working-directory: mcp/fwb05-poc
        run: npm install --no-audit --no-fund
      - name: Start disposable Keycloak with distinct service and subject accounts
        run: |
          docker run --detach --rm --name fwb-reg04d-r1-keycloak \
            --publish 127.0.0.1:8080:8080 \
            --env KC_BOOTSTRAP_ADMIN_USERNAME=lab-admin \
            --env KC_BOOTSTRAP_ADMIN_PASSWORD=only-temporary-ci-admin \
            --env KC_HOSTNAME=https://auth-lab.example.org \
            --env KC_PROXY_HEADERS=xforwarded \
            --volume "$PWD/tests/fwb-reg04d-r1/keycloak-realm.json:/opt/keycloak/data/import/fwb-reg04b-lab-realm.json:ro" \
            quay.io/keycloak/keycloak:26.8.2 \
            start-dev --features=cimd,resource-indicators --import-realm
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/realms/fwb-reg04b-lab/.well-known/openid-configuration >/dev/null; then break; fi
            sleep 3
          done
          curl -fsS http://127.0.0.1:8080/realms/fwb-reg04b-lab/.well-known/openid-configuration >/dev/null
      - name: Set up CI-only trusted HTTPS
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -keyout /tmp/fwb-r1-lab-key.pem -out /tmp/fwb-r1-lab-cert.pem \
            -subj '/CN=auth-lab.example.org' \
            -addext 'subjectAltName=DNS:auth-lab.example.org' >/dev/null 2>&1
          echo '127.0.0.1 auth-lab.example.org' | sudo tee -a /etc/hosts >/dev/null
          sudo env FWB_LAB_TLS_KEY=/tmp/fwb-r1-lab-key.pem \
            FWB_LAB_TLS_CERT=/tmp/fwb-r1-lab-cert.pem \
            "$(command -v node)" tests/fwb-reg04b/tls-test-proxy.mjs \
            > /tmp/fwb-r1-lab-proxy.log 2>&1 &
          for i in $(seq 1 15); do
            if curl --silent --fail --cacert /tmp/fwb-r1-lab-cert.pem \
              https://auth-lab.example.org/realms/fwb-reg04b-lab/.well-known/openid-configuration >/dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail --cacert /tmp/fwb-r1-lab-cert.pem \
            https://auth-lab.example.org/realms/fwb-reg04b-lab/.well-known/openid-configuration >/dev/null
      - name: Keycloak real FGAP setup, then enforce field-only binding writes and negative cases
        env:
          NODE_EXTRA_CA_CERTS: /tmp/fwb-r1-lab-cert.pem
          HTTPS_PROXY: ''
          HTTP_PROXY: ''
          ALL_PROXY: ''
          NO_PROXY: auth-lab.example.org,127.0.0.1,localhost
        run: node tests/fwb-reg04d-r2b1/native-profile-e2e.mjs
      - name: Real end-user OAuth PKCE and protected account attributes
        env:
          FWB_LAB_TLS_CERT: /tmp/fwb-r1-lab-cert.pem
          HTTPS_PROXY: ''
          HTTP_PROXY: ''
          ALL_PROXY: ''
          NO_PROXY: auth-lab.example.org,127.0.0.1,localhost
        run: |
          python -m pip install --disable-pip-version-check --quiet requests PyJWT beautifulsoup4
          python tests/fwb-reg04d-r2b1/user-account-pkce.py
      - name: Sanitized Keycloak errors for User Profile API diagnostic
        if: always()
        shell: bash
        run: |
          docker logs fwb-reg04d-r1-keycloak 2>&1 |
            grep -E 'ERROR|WARN|Failed to update user profile|UserProfile|ValidationException' |
            tail -50 | sed -E 's/[A-Za-z0-9_\\-]{60,}/[redacted]/g' || true
      - name: Remove disposable identity provider and TLS materials
        if: always()
        run: |
          docker rm -f fwb-reg04d-r1-keycloak >/dev/null 2>&1 || true
          rm -f /tmp/fwb-r1-lab-key.pem /tmp/fwb-r1-lab-cert.pem
