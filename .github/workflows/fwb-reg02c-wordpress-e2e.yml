name: FWB-REG-02C — Ephemeral WordPress real OAuth MCP E2E

on:
  pull_request:
    paths:
      - 'tests/fwb-reg02c/**'
      - 'plugins/forja-wp-oauth-stage/**'
      - '.github/workflows/fwb-reg02c-wordpress-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-wordpress-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: curl, openssl
      - name: Compile patched OAuth provider (test-only)
        working-directory: plugins/forja-wp-oauth-stage
        run: |
          composer update --no-dev --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
          node tools/patch-cimd.mjs
          php tests/cimd-compatibility.php
          php tests/staging-permissions.php
      - name: Install official WordPress wp-env
        run: npm install --global @wordpress/env --no-audit --no-fund
      - name: Boot isolated real WordPress and database
        working-directory: tests/fwb-reg02c
        run: wp-env start --update
      - name: Install official MCP Adapter only in disposable WordPress
        working-directory: tests/fwb-reg02c
        run: |
          wp-env run cli wp plugin install mcp-adapter
          wp-env run cli wp plugin activate mcp-adapter
          wp-env run cli wp plugin activate forja-wp-oauth-stage
          wp-env run cli wp rewrite flush
          wp-env run cli wp user create e2eauthor e2eauthor@example.invalid --role=author --user_pass=ephemeral-test-only-do-not-reuse
          wp-env run cli wp post create --post_type=post --post_status=draft --post_title=E2EOwnDraft --post_author=2
          wp-env run cli wp plugin list
      - name: Verify real OAuth/PKCE/consent/token/MCP over localhost
        env:
          FWB_E2E_PASSWORD: ephemeral-test-only-do-not-reuse
          FWB_E2E_BASE: http://localhost:8888
        run: |
          python3 -m pip install --user requests --quiet
          python3 tests/fwb-reg02c/oauth-mcp-e2e.py
      - name: Tear down ephemeral WordPress
        if: always()
        working-directory: tests/fwb-reg02c
        run: wp-env stop || true
