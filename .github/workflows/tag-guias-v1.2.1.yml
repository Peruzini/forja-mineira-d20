name: Tag Guias v1.2.1

on:
  push:
    paths:
      - '.github/workflows/tag-guias-v1.2.1.yml'

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create immutable v1.2.1 tag
        shell: bash
        run: |
          set -euo pipefail
          TARGET="5e0af7e2c5d7216630cc9dcea662ee99edeab816"

          if git ls-remote --exit-code --tags origin "refs/tags/v1.2.1" >/dev/null 2>&1; then
            EXISTING="$(git ls-remote --tags origin "refs/tags/v1.2.1" | awk '{print $1}')"
            if [ "$EXISTING" = "$TARGET" ]; then
              echo "Tag v1.2.1 already points to validated commit."
              exit 0
            fi
            echo "Refusing to move existing tag v1.2.1 from $EXISTING to $TARGET."
            exit 1
          fi

          git tag v1.2.1 "$TARGET"
          git push origin refs/tags/v1.2.1
