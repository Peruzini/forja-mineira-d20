name: Package Forja Mineira Builds Plugin

on:
  push:
    paths:
      - 'plugins/forja-mineira-builds/**'
      - '.github/workflows/package-builds-plugin.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package plugin
        run: |
          mkdir -p dist
          cp -R plugins/forja-mineira-builds dist/forja-mineira-builds
          cd dist
          zip -r forja-mineira-builds-v2.3.26.zip forja-mineira-builds

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: forja-mineira-builds-v2.3.26
          path: dist/forja-mineira-builds-v2.3.26.zip
          if-no-files-found: error
