name: Restore exact plugin sources

on:
  push:
    paths:
      - '.github/workflows/restore-sources.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact source files from uploaded packages
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .staging/source-fix.tar.gz.b64 | tar -xzf -

          test "$(git hash-object plugins/forja-mineira-builds/includes/class-build-voting.php)" = "92edf84e568ebc7713300fd0db44909a5df8a511"
          test "$(git hash-object plugins/forja-mineira-builds/templates/builds-hub.php)" = "12a9a5f48bb3c0de70e99cdbeeee82a321ee4f0b"
          test "$(git hash-object plugins/forja-mineira-builds/templates/home-build-cycle.php)" = "159f2f8ffdf2519d8f99ba7440732de9326fd591"
          test "$(git hash-object plugins/forja-mineira-builds/templates/home-hero.php)" = "99ecd761b8a604e77fd4d112ca28cb58533e3386"
          test "$(git hash-object plugins/forja-mineira-builds/templates/home-next-build.php)" = "5795b6e27dd625a61ffe8c3355550ed8a92d4752"
          test "$(git hash-object plugins/forja-mineira-guias/templates/guide-warlock-items.php)" = "079ff3e42156d3de11ea49c1093c4347b6eb1ca6"

      - name: Commit restored sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             plugins/forja-mineira-builds/includes/class-build-voting.php             plugins/forja-mineira-builds/templates/builds-hub.php             plugins/forja-mineira-builds/templates/home-build-cycle.php             plugins/forja-mineira-builds/templates/home-hero.php             plugins/forja-mineira-builds/templates/home-next-build.php             plugins/forja-mineira-guias/templates/guide-warlock-items.php
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "fix: restore exact plugin sources from release packages"
          git push
