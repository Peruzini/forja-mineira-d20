name: Sync production assets

on:
  push:
    paths:
      - '.github/workflows/sync-assets.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download production assets
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ROOT="plugins/forja-mineira-builds/assets"
          GUIDE_ROOT="plugins/forja-mineira-guias/assets"
          BUILD_DIR="$BUILD_ROOT/images"
          GUIDE_DIR="$GUIDE_ROOT/images"
          mkdir -p "$BUILD_DIR" "$GUIDE_DIR" "$BUILD_ROOT/css" "$BUILD_ROOT/js" "$GUIDE_ROOT/css"

          base="https://forjamineirad20.com.br/wp-content/plugins/forja-mineira-builds/assets/images"
          files=(
            home-featured-guide-warlock-items.webp
            home-hero-castelo.webp
            home-next-build-mystery-final.webp
            home-vote-duncan.webp
            home-vote-guts.webp
            home-vote-trevor.webp
            next-build-mystery-teaser.webp
            pao-de-queijo-d20-fumegante-transparente.webp
            pao-de-queijo-d20-fumegante.webp
            pao-de-queijo-d20.png
            voldemort-featured-five-stages.webp
            voldemort-l0-img1-bf37cae6cb3b.webp
            voldemort-l1-img1-125a8ca23d16.webp
            voldemort-l10-img1-8a34eabce6e8.webp
            voldemort-l13-img1-e2fbb9b1f8f4.webp
            voldemort-l14-img1-5f2b329670ba.webp
            voldemort-l17-img1-bffe22434a23.webp
            voldemort-l18-img1-4f56da1fa4b1.webp
            voldemort-l18-img2-e948c5eab4e4.webp
            voldemort-l2-img1-ecb080f09b29.webp
            voldemort-l5-img1-c6b2fe242126.webp
            voldemort-l6-img1-d1e6c9b426ce.webp
            voldemort-l9-img1-5e4d809091d5.webp
            voldemort-progression-1-20-featured.webp
          )

          for file in "${files[@]}"; do
            echo "Downloading $file"
            curl --fail --location --retry 3 --user-agent "Forja-Mineira-GitHub-Sync/1.0"               "$base/$file" -o "$BUILD_DIR/$file"
          done

          curl --fail --location --retry 3 --user-agent "Forja-Mineira-GitHub-Sync/1.0"             "https://forjamineirad20.com.br/wp-content/plugins/forja-mineira-guias/assets/images/guia-itens-bruxo-1-5.webp"             -o "$GUIDE_DIR/guia-itens-bruxo-1-5.webp"

          curl --fail --location --retry 3 --user-agent "Forja-Mineira-GitHub-Sync/1.0"             "https://forjamineirad20.com.br/wp-content/plugins/forja-mineira-builds/assets/css/builds.css"             -o "$BUILD_ROOT/css/builds.css"

          curl --fail --location --retry 3 --user-agent "Forja-Mineira-GitHub-Sync/1.0"             "https://forjamineirad20.com.br/wp-content/plugins/forja-mineira-builds/assets/js/builds.js"             -o "$BUILD_ROOT/js/builds.js"

          curl --fail --location --retry 3 --user-agent "Forja-Mineira-GitHub-Sync/1.0"             "https://forjamineirad20.com.br/wp-content/plugins/forja-mineira-guias/assets/css/guide-warlock-items.css"             -o "$GUIDE_ROOT/css/guide-warlock-items.css"

      - name: Commit assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/forja-mineira-builds/assets plugins/forja-mineira-guias/assets
          if git diff --cached --quiet; then
            echo "No asset changes."
            exit 0
          fi
          git commit -m "chore: sync production assets"
          git push
