name: PERF-ITENS-13 CDN read-only HTTP probe
on:
  push:
    branches: [diag/perf-itens-13-cdn-20261112]
    paths: ['.github/workflows/perf-itens-13-cdn-once.yml']
permissions: {}
jobs:
  check-cdn:
    if: github.event.head_commit.message == 'Run PERF-ITENS-13 CDN-only once'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify HTTP probe syntax
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/perf-itens-13-cdn.py
          curl --version
      - name: Three exact-URL Hero GETs and two cache controls
        env:
          PERF13_OUTPUT: ${{ runner.temp }}/perf13
        run: |
          set -euo pipefail
          python3 scripts/perf-itens-13-cdn.py
      - name: Preserve request headers and timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PERF-ITENS-13-CDN-HTTP-EVIDENCE
          path: ${{ runner.temp }}/perf13
          if-no-files-found: warn
          retention-days: 30
