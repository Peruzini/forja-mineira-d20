name: Tag Guias v1.2.0

on:
  push:
    paths:
      - '.github/workflows/tag-guias-v1.2.0.yml'

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create immutable v1.2.0 tag
        shell: bash
        run: |
          set -euo pipefail
          TARGET="d0f40a0d560db3b020c99ecf3f15dc7957f7c429"

          if git ls-remote --exit-code --tags origin "refs/tags/v1.2.0" >/dev/null 2>&1; then
            EXISTING="$(git ls-remote --tags origin "refs/tags/v1.2.0" | awk '{print $1}')"
            if [ "$EXISTING" = "$TARGET" ]; then
              echo "Tag v1.2.0 already points to validated commit."
              exit 0
            fi
            echo "Refusing to move existing tag v1.2.0 from $EXISTING to $TARGET."
            exit 1
          fi

          git tag v1.2.0 "$TARGET"
          git push origin refs/tags/v1.2.0
