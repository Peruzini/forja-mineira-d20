name: PERF-ITENS-08-R2 capture once
on:
  push:
    branches: [diag/perf-itens-08-r2-once-20261109]
    paths: ['.github/workflows/perf-itens-08-r2-once.yml']
permissions: {}
jobs:
  capture:
    if: >-
      github.event.head_commit.message == 'Run PERF-ITENS-08-R2 with standard mobile UA once'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install diagnostic dependencies in runner temp
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          node --version
          google-chrome --version
          npm install --ignore-scripts --no-audit --no-fund lighthouse@13.6.0
      - name: Capture Lighthouse and associated Chrome trace
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          cat > collect-r2.mjs <<'PERF08_SCRIPT'
          import {lookup} from 'node:dns/promises';
          import {mkdir, mkdtemp, writeFile} from 'node:fs/promises';
          import {join} from 'node:path';
          import {tmpdir} from 'node:os';
          import {createHash} from 'node:crypto';
          import puppeteer from 'puppeteer-core';
          import lighthouse from 'lighthouse';
          
          const url = 'https://forjamineirad20.com.br/itens-magicos-conjuradores-dnd-2024/';
          const output = process.argv[2];
          const executablePath = process.argv[3] || process.env.CHROME_PATH;
          const names = {
            report: 'PERF-ITENS-08-R2-LIGHTHOUSE-MOBILE.json',
            trace: 'PERF-ITENS-08-R2-CHROME-TRACE.json',
            metadata: 'PERF-ITENS-08-R2-RUN-METADATA.json',
          };
          await mkdir(output, {recursive: true});
          const startedAt = new Date().toISOString();
          const addresses = await lookup(new URL(url).hostname, {all: true});
          const preflight = await fetch(url, {signal: AbortSignal.timeout(15000)});
          if (!preflight.ok) throw new Error('HTTPS preflight returned '+preflight.status);
          await preflight.body?.cancel();
          console.log('DNS and HTTPS:', addresses.length, preflight.status);
          const browser = await puppeteer.launch({
            executablePath, headless: true, pipe: true, dumpio: true,
            userDataDir: await mkdtemp(join(tmpdir(), 'perf08-r2-profile-')),
            timeout: 20000,
          });
          try {
            const chrome = await browser.version();
            const page = await browser.newPage();
            const cdp = await page.createCDPSession();
            const cdpVersion = await cdp.send('Browser.getVersion');
            await cdp.detach();
            console.log('Chrome / CDP / Node:', chrome, cdpVersion.protocolVersion, process.version);
            const major = chrome.match(/\/(\d+)/)?.[1];
            const mobileUA = 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/' + major + '.0.0.0 Mobile Safari/537.36';
            page.on('response', response => {
              if (!response.request().isNavigationRequest() || response.frame() !== page.mainFrame()) return;
              const h = response.headers();
              console.log('Browser document HTTP:', response.status(), response.url(),
                JSON.stringify({server: h.server, cache: h['x-hcdn-cache-status'], litespeed: h['x-litespeed-cache'], contentType: h['content-type']}));
            });
            const result = await lighthouse(url, {throttlingMethod: 'devtools', emulatedUserAgent: mobileUA, logLevel: 'error'}, undefined, page);
            if (!result?.lhr || result.lhr.runtimeError) throw new Error(JSON.stringify(result?.lhr?.runtimeError ?? 'No Lighthouse result'));
            const {lhr, artifacts} = result;
            const trace = artifacts.Trace;
            if (!trace?.traceEvents?.some(event => event.name === 'largestContentfulPaint::Candidate')) {
              throw new Error('Lighthouse trace lacks a browser LCP candidate');
            }
            const reportBytes = JSON.stringify(lhr, null, 2);
            const traceBytes = JSON.stringify(trace);
            const bytes = [reportBytes, traceBytes];
            const files = [names.report, names.trace];
            const exported = {};
            for (const [index, name] of files.entries()) {
              const data = bytes[index];
              await writeFile(join(output, name), data);
              exported[name] = {status: 'exported', bytes: Buffer.byteLength(data), sha256: createHash('sha256').update(data).digest('hex')};
            }
            const metadata = {
              startedAt, finishedAt: new Date().toISOString(), initialUrl: url,
              finalUrl: lhr.finalDisplayedUrl ?? lhr.finalUrl,
              id: process.env.GITHUB_RUN_ID ? process.env.GITHUB_RUN_ID + '-' + process.env.GITHUB_RUN_ATTEMPT : 'local-' + startedAt,
              chrome, cdp: cdpVersion.protocolVersion, node: process.version, lighthouse: lhr.lighthouseVersion,
              userAgent: lhr.environment?.networkUserAgent ?? lhr.userAgent,
              viewport: lhr.configSettings.screenEmulation, throttlingMethod: lhr.configSettings.throttlingMethod,
              throttling: lhr.configSettings.throttling, cache: 'fresh temporary Chrome profile, default Lighthouse storage reset; production cache untouched',
              sameNavigation: true, traceEventCount: trace.traceEvents.length, exported,
            };
            await writeFile(join(output, names.metadata), JSON.stringify(metadata, null, 2));
            if (artifacts.DevtoolsLog) await writeFile(join(output, 'devtools-log.intermediate.json'), JSON.stringify(artifacts.DevtoolsLog));
            console.log(JSON.stringify(metadata));
          } finally {
            await browser.close();
          }
          PERF08_SCRIPT
          node collect-r2.mjs "$RUNNER_TEMP/perf08-r2" "$(command -v google-chrome)"
          sha256sum "$RUNNER_TEMP"/perf08-r2/PERF-ITENS-08-R2-*.json
      - name: Archive the original files
        uses: actions/upload-artifact@v4
        with:
          name: PERF-ITENS-08-R2-RAW
          path: ${{ runner.temp }}/perf08-r2/PERF-ITENS-08-R2-*.json
          if-no-files-found: error
          retention-days: 30
